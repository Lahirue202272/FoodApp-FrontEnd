server {
    listen 80;
    # server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — falls back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html — always fetch fresh so the browser
    # picks up the latest hashed asset filenames after a deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Long-term cache for hashed static assets (safe since filenames
    # change whenever content changes)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}