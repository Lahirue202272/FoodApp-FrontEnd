name: Deploy React Application
on:
  push:
    branches:
      - main   # or whichever branch you deploy from

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t lahiruniroshan/food-app-frontend \
            --build-arg REACT_APP_BASE_URL='${{ secrets.REACT_APP_BASE_URL }}' \
            .

      - name: Publish Image to docker hub
        run: docker push lahiruniroshan/food-app-frontend:latest

  deploy:
    needs: build
    runs-on: aws-ec2
    steps:
      - name: Pull image from docker hub
        run: docker pull lahiruniroshan/food-app-frontend:latest

      - name: Delete old container
        run: docker rm -f food-app-container

      - name: Run Docker Container
        run: docker run -d -p 80:80 --name food-app-container lahiruniroshan/food-app-frontend